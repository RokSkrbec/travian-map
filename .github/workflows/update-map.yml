name: Update map

# map.sql on rog.x2.europe.travian.com is regenerated every day at midnight server time (UTC).
# GitHub delays or skips scheduled runs when it's busy, and around 00:00 UTC is its busiest
# time, so run twice: shortly after midnight, and again a few hours later as a backup.
# Each run just rebuilds from the current map.sql, so an extra run is harmless.
on:
  schedule:
    - cron: '17 0 * * *'
    - cron: '43 3 * * *'
  workflow_dispatch: {}   # "Run workflow" button for a manual refresh
  push:
    branches: [main]

permissions:
  contents: write   # to commit the daily snapshot in history/
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download map.sql and rebuild the page
        run: python3 build/update_map.py

      - name: Prepare site
        run: |
          mkdir -p _site
          cp travian-regions.html _site/index.html
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4

      # Keep today's villages in history/ for the Farms & changes tab. [skip ci] so this commit
      # doesn't start another run. Plan saves and the nightly refresh also push to main, so retry.
      - name: Save today's snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history
          if git diff --cached --quiet; then echo "Snapshot unchanged"; exit 0; fi
          git commit -m "Map snapshot $(date -u +%F) [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
